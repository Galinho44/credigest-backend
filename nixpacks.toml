# nixpacks.toml - Configuração de build para Railway
# https://nixpacks.com/docs/configuration

[phases.setup]
nixPkgs = ["nodejs_22", "sqlite"]

[phases.install]
cmds = ["npm ci --omit=dev"]

[phases.build]
# Sem build step - o projeto roda direto com Node

[start]
cmd = "node --no-warnings --env-file-if-exists=.env src/server.js"

[variables]
NODE_ENV = "producao"
HOST = "0.0.0.0"
# PORT é injetado automaticamente pelo Railway